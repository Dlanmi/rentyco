<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Colors — Semantic</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.s{display:flex;flex-direction:column;gap:6px}
.sw{height:80px;border-radius:12px}
.nm{font:var(--t-label-md);color:var(--color-ink)}
.hex{font:var(--t-mono);color:var(--color-ink-muted)}</style></head><body>
<div class="s"><div class="sw" style="background:#16A34A"></div><span class="nm">success</span><span class="hex">#16A34A</span></div>
<div class="s"><div class="sw" style="background:#F59E0B"></div><span class="nm">warning</span><span class="hex">#F59E0B</span></div>
<div class="s"><div class="sw" style="background:#DC2626"></div><span class="nm">error</span><span class="hex">#DC2626</span></div>
</body></html>
