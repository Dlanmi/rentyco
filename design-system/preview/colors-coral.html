<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Colors — Coral</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.s{display:flex;flex-direction:column;gap:6px}
.sw{height:80px;border-radius:12px;border:1px solid rgba(0,0,0,.04)}
.nm{font:var(--t-label-md);color:var(--color-ink)}
.hex{font:var(--t-mono);color:var(--color-ink-muted)}</style></head><body>
<div class="s"><div class="sw" style="background:#E8634A"></div><span class="nm">coral / default</span><span class="hex">#E8634A</span></div>
<div class="s"><div class="sw" style="background:#FCEAE6"></div><span class="nm">coral / light</span><span class="hex">#FCEAE6</span></div>
<div class="s"><div class="sw" style="background:#C4402A"></div><span class="nm">coral / dark</span><span class="hex">#C4402A</span></div>
</body></html>
