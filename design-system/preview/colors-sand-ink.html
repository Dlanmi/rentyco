<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Colors — Sand & Ink</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#fff;display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.s{display:flex;flex-direction:column;gap:6px}
.sw{height:76px;border-radius:10px;border:1px solid var(--color-border)}
.nm{font:var(--t-label-md);color:var(--color-ink);font-size:11px}
.hex{font:var(--t-mono);color:var(--color-ink-muted);font-size:10px}</style></head><body>
<div class="s"><div class="sw" style="background:#FAF7F2"></div><span class="nm">sand</span><span class="hex">#FAF7F2</span></div>
<div class="s"><div class="sw" style="background:#F0EDE5"></div><span class="nm">sand-dark</span><span class="hex">#F0EDE5</span></div>
<div class="s"><div class="sw" style="background:#FFFFFF"></div><span class="nm">surface</span><span class="hex">#FFFFFF</span></div>
<div class="s"><div class="sw" style="background:#1C1917"></div><span class="nm">ink</span><span class="hex">#1C1917</span></div>
<div class="s"><div class="sw" style="background:#3D3836"></div><span class="nm">ink-2</span><span class="hex">#3D3836</span></div>
<div class="s"><div class="sw" style="background:#6B6560"></div><span class="nm">ink-muted</span><span class="hex">#6B6560</span></div>
<div class="s"><div class="sw" style="background:#A8A29E"></div><span class="nm">ink-subtle</span><span class="hex">#A8A29E</span></div>
</body></html>
