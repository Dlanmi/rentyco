<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Radius</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.s{display:flex;flex-direction:column;align-items:center;gap:6px}
.b{width:80px;height:80px;background:var(--color-teal-lighter);border:1px solid var(--color-teal)}
.n{font:var(--t-label-md);color:var(--color-ink)}.h{font:var(--t-mono);color:var(--color-ink-muted)}</style></head><body>
<div class="s"><div class="b" style="border-radius:8px"></div><span class="n">md</span><span class="h">8px</span></div>
<div class="s"><div class="b" style="border-radius:12px"></div><span class="n">lg</span><span class="h">12px</span></div>
<div class="s"><div class="b" style="border-radius:16px"></div><span class="n">xl</span><span class="h">16px</span></div>
<div class="s"><div class="b" style="border-radius:24px"></div><span class="n">3xl</span><span class="h">24px</span></div>
<div class="s"><div class="b" style="border-radius:9999px"></div><span class="n">full</span><span class="h">pill</span></div>
</body></html>
