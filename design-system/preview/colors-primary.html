<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Colors — Primary</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#fff;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.s{display:flex;flex-direction:column;gap:6px}
.sw{height:80px;border-radius:12px;border:1px solid rgba(0,0,0,.04)}
.nm{font:var(--t-label-md);color:var(--color-ink)}
.hex{font:var(--t-mono);color:var(--color-ink-muted)}</style></head><body>
<div class="s"><div class="sw" style="background:#0D6B58"></div><span class="nm">teal / default</span><span class="hex">#0D6B58</span></div>
<div class="s"><div class="sw" style="background:#10B981"></div><span class="nm">teal / light</span><span class="hex">#10B981</span></div>
<div class="s"><div class="sw" style="background:#E8F5F0"></div><span class="nm">teal / lighter</span><span class="hex">#E8F5F0</span></div>
<div class="s"><div class="sw" style="background:#064E3B"></div><span class="nm">teal / dark</span><span class="hex">#064E3B</span></div>
</body></html>
