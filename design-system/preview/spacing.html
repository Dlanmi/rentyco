<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:#fff;display:flex;flex-direction:column;gap:6px;font:var(--t-body-sm)}
.r{display:flex;align-items:center;gap:12px}
.bar{height:14px;background:var(--color-teal);border-radius:4px}
.lbl{font:var(--t-mono);color:var(--color-ink-muted);min-width:72px}</style></head><body>
<div class="r"><span class="lbl">4 · 4px</span>  <div class="bar" style="width:4px"></div></div>
<div class="r"><span class="lbl">8 · 8px</span>  <div class="bar" style="width:8px"></div></div>
<div class="r"><span class="lbl">12 · 12px</span> <div class="bar" style="width:12px"></div></div>
<div class="r"><span class="lbl">16 · 16px</span> <div class="bar" style="width:16px"></div></div>
<div class="r"><span class="lbl">24 · 24px</span> <div class="bar" style="width:24px"></div></div>
<div class="r"><span class="lbl">32 · 32px</span> <div class="bar" style="width:32px"></div></div>
<div class="r"><span class="lbl">48 · 48px</span> <div class="bar" style="width:48px"></div></div>
<div class="r"><span class="lbl">80 · 80px</span> <div class="bar" style="width:80px"></div></div>
<div class="r"><span class="lbl">120 · 120px</span><div class="bar" style="width:120px"></div></div>
</body></html>
