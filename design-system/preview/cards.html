<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:var(--color-sand);display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border:1px solid var(--color-border);border-radius:16px;padding:22px}
.stat .num{font:var(--t-mono-stat);color:var(--color-teal);display:block;line-height:1}
.stat .lbl{font:var(--t-h4);color:var(--color-ink);display:block;margin-top:8px}
.stat .src{font:var(--t-mono);color:var(--color-ink-muted);display:block;margin-top:8px}
.feat .ic{width:40px;height:40px;border-radius:12px;background:var(--color-teal-lighter);color:var(--color-teal);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.feat h4{font:var(--t-h4);color:var(--color-ink);margin:0 0 6px}
.feat p{font:var(--t-body-sm);color:var(--color-ink-muted);margin:0}</style></head><body>
<div class="card stat"><span class="num">57%</span><span class="lbl">de contratos son verbales</span><span class="src">Fuente: Fedelonjas 2024</span></div>
<div class="card feat"><div class="ic"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div><h4>Sin codeudor</h4><p>Tu historial de pago es tu garantía. Sin fiadores ni finca raíz.</p></div>
</body></html>
