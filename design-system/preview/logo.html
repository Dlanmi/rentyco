<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Logo — Renty</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-sand); display: flex; gap: 20px; align-items: stretch; }
  .tile { flex: 1; padding: 28px 24px 18px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 14px; min-height: 130px; }
  .tile img { height: 48px; display: block; }
  .tile span { font: var(--t-mono); color: currentColor; opacity: .55; text-transform: uppercase; letter-spacing: .14em; }
  .a { background: var(--color-sand-dark); border: 1px solid var(--color-border); color: var(--color-ink); }
  .b { background: var(--color-ink); color: #FAF7F2; }
  .c { background: var(--color-teal); color: #FAF7F2; }
</style>
</head><body>
<div class="tile a"><img src="../assets/logo-wordmark.svg" alt="Renty"><span>Sand / default</span></div>
<div class="tile b"><img src="../assets/logo-wordmark-white.svg" alt="Renty"><span>Ink / dark</span></div>
<div class="tile c"><img src="../assets/logo-wordmark-white.svg" alt="Renty"><span>Teal / brand</span></div>
</body></html>
