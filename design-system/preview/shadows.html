<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-sand);display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.s{display:flex;flex-direction:column;align-items:center;gap:8px}
.b{width:88px;height:72px;background:#fff;border-radius:12px}
.n{font:var(--t-mono);color:var(--color-ink-muted)}</style></head><body>
<div class="s"><div class="b" style="box-shadow:var(--shadow-sm)"></div><span class="n">sm</span></div>
<div class="s"><div class="b" style="box-shadow:var(--shadow-md)"></div><span class="n">md</span></div>
<div class="s"><div class="b" style="box-shadow:var(--shadow-lg)"></div><span class="n">lg</span></div>
<div class="s"><div class="b" style="box-shadow:var(--shadow-teal)"></div><span class="n">teal</span></div>
<div class="s"><div class="b" style="box-shadow:var(--shadow-coral)"></div><span class="n">coral</span></div>
</body></html>
